# Orbit Clean 的品牌配置。构建时由 build-logic 的 appbase.brand-app 插件读取（见 build-logic/convention/src/main/kotlin/BrandAppPlugin.kt）。
# 同名的 Gradle 属性（-P 或 ~/.gradle/gradle.properties）会覆盖这里的值，适合放只属于本机的设置，例如 ADMOB_TEST_DEVICE_IDS。
# release 构建会校验必填项，缺失或仍是示例值时直接报错（validateBrand）。
#
# 本模块的其他品牌素材：
#   src/main/res/     启动图标、通知图标、字体、窗口底色
#   src/main/assets/  字体许可证
#   store/            商店图标、隐私政策页面、app-ads.txt 模板

# ---------------------------------------------------------------- 上架身份
# 当前覆盖上架到 Kexing PortVanguard。包名上架后不能再改
APPLICATION_ID=com.kexing.portvanguard
VERSION_CODE=10600
VERSION_NAME=1.0.6
# 上传密钥配置文件（项目根目录，不入库）。缺少时 release 退回 debug 签名，只能自测、不能上传 Play
SIGNING_PROPERTIES=keystore-portvanguard.properties

# ---------------------------------------------------------------- 名称与链接
APP_NAME=Orbit Clean
# 品牌名下方的一句话介绍
APP_TAGLINE=File manager & storage cleaner
# 隐私政策托管在 GitHub Pages（仓库 orbitclean/orbitclean.github.io），源文件在 store/privacy-policy
PRIVACY_URL=https://orbitclean.github.io/privacy/
FEEDBACK_EMAIL=j0618313586@gmail.com
# 开发者网站：app-ads.txt 部署在它的根目录，Play 商店页的“网站”也填它
WEBSITE_URL=https://orbitclean.github.io/

# ---------------------------------------------------------------- 广告
# Google AdMob。基座先用 Google 官方测试广告（https://developers.google.com/admob/android/test-ads），release APK 也只会展示测试广告，
# 打上传用的 AAB（bundleRelease）会被 validateUpload 拦下。出正式马甲包时换成该包在 AdMob 后台新建的应用 ID 和广告位。
# debug 包无论这里填什么都固定使用测试广告位
ADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713
ADMOB_BANNER_AD_UNIT_ID=ca-app-pub-3940256099942544/9214589741
ADMOB_INTERSTITIAL_AD_UNIT_ID=ca-app-pub-3940256099942544/1033173712
ADMOB_APP_OPEN_AD_UNIT_ID=ca-app-pub-3940256099942544/9257395921
# 可选：用 release 包在自己手机上测试时，把 logcat 里 "Use RequestConfiguration...setTestDeviceIds" 提示的设备 ID 填在这里（逗号分隔），
# 这些设备只会收到测试广告。切勿点击自己 app 里的真实广告
ADMOB_TEST_DEVICE_IDS=

# AppLovin MAX：替换为后台的真实值。保持 YOUR_ 前缀时不初始化 SDK，使用占位广告位
APPLOVIN_SDK_KEY=YOUR_SDK_KEY
MAX_BANNER_AD_UNIT_ID=YOUR_BANNER_AD_UNIT_ID
MAX_INTERSTITIAL_AD_UNIT_ID=YOUR_INTERSTITIAL_AD_UNIT_ID
# 可选：开屏广告（App Open）。不填时开屏改用插屏广告位
MAX_APP_OPEN_AD_UNIT_ID=YOUR_APP_OPEN_AD_UNIT_ID

# ---------------------------------------------------------------- 归因
# Adjust 应用识别码（App Token，12 位）。基座先留空：留空时不初始化 Adjust，也不上报广告收入；
# 出正式包时填该包在 Adjust 后台新建应用的 App Token
ADJUST_APP_TOKEN=
