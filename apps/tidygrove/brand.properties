# Tidy Grove 的品牌配置，由 build-logic 的 appbase.brand-app 插件读取（见 build-logic/convention/src/main/kotlin/BrandAppPlugin.kt）。
# 取值优先级：同目录的 brand.local.properties（不入库）> 同名 Gradle 属性 > 本文件 > 账号默认值（accounts/studio-b/account.properties，只有 SIGNING_PROPERTIES、FEEDBACK_EMAIL）。
# 正式的 AdMob / AppLovin / Adjust ID 放 brand.local.properties，本文件保持测试 ID。
# 打 AAB 前除了 validateBrand / validateUpload，还会做账号串号校验（AccountGuard，见 accounts/README.md）。
# 生成于 2026-11-16，复刻模式：母包 orbitclean，变体 scene=ring nav=tabs home=grid clean=onetap browser=grid done=checklist

# ---------------------------------------------------------------- 所属账号
# Play 开发者账号（accounts/<账号>/），同一账号里同一个母包只能有一个复刻包
ACCOUNT=studio-b
# 复刻自哪个母包、用了哪组变体（scaffold.py 据此拦“同账号同母包两个复刻”和“和已有复刻同一组变体”；构建不读）
CLONE_OF=orbitclean
CLONE_VARIANTS=scene=ring nav=tabs home=grid clean=onetap browser=grid done=checklist

# ---------------------------------------------------------------- 上架身份
# 包名上架后不能再改
APPLICATION_ID=com.example.tidygrove
VERSION_CODE=10000
VERSION_NAME=1.0.0
# 上传密钥配置文件（项目根目录，不入库）。留空时用账号的 SIGNING_PROPERTIES；都没有时 release 用 debug 签名，只能自测
SIGNING_PROPERTIES=

# ---------------------------------------------------------------- 名称与链接
APP_NAME=Tidy Grove
APP_TAGLINE=Clear clutter, keep what matters
# 隐私政策和网站都要在本账号的网站域名下（WEBSITE_ROOT）
PRIVACY_URL=https://example.com/tidygrove/privacy/
# 留空时用账号的 FEEDBACK_EMAIL
FEEDBACK_EMAIL=tidygrove@example.com
WEBSITE_URL=https://example.com/tidygrove/

# ---------------------------------------------------------------- 广告
# 广告开关：off = 无广告首版（白包），广告 / 授权弹窗 / 归因 SDK 都不进包，打 AAB 不要求 AdMob ID 和 app-ads.txt；
# 上架稳定后发带广告的版本时改成 on，并填好下面的正式 AdMob ID（brand.local.properties）、改商店声明，见 store/submission.md
ADS=off

# Google AdMob：本应用在本账号对应的 AdMob 后台单独新建的应用 ID 和广告位；占位时为 Google 官方测试 ID。
# debug 包无论这里填什么都固定使用测试广告位
ADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713
ADMOB_BANNER_AD_UNIT_ID=ca-app-pub-3940256099942544/9214589741
ADMOB_INTERSTITIAL_AD_UNIT_ID=ca-app-pub-3940256099942544/1033173712
ADMOB_APP_OPEN_AD_UNIT_ID=ca-app-pub-3940256099942544/9257395921
# 可选：只收测试广告的设备 ID（逗号分隔），建议放 ~/.gradle/gradle.properties
ADMOB_TEST_DEVICE_IDS=

# AppLovin MAX：保持 YOUR_ 前缀时不初始化，直接用 AdMob
APPLOVIN_SDK_KEY=YOUR_SDK_KEY
MAX_BANNER_AD_UNIT_ID=YOUR_BANNER_AD_UNIT_ID
MAX_INTERSTITIAL_AD_UNIT_ID=YOUR_INTERSTITIAL_AD_UNIT_ID
MAX_APP_OPEN_AD_UNIT_ID=YOUR_APP_OPEN_AD_UNIT_ID

# ---------------------------------------------------------------- 归因
# Adjust App Token，留空不初始化
ADJUST_APP_TOKEN=
