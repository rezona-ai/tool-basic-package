# {{APP_NAME}} 的品牌配置，由 build-logic 的 appbase.brand-app 插件读取（见 build-logic/convention/src/main/kotlin/BrandAppPlugin.kt）。
# 取值优先级：同目录的 brand.local.properties（不入库，只对本应用生效）> 同名 Gradle 属性（-P 或 ~/.gradle/gradle.properties，所有应用共用）> 本文件。
# 正式的 AdMob / AppLovin / Adjust ID 放 brand.local.properties，本文件保持测试 ID。
# 占位值（com.example.*、example.com、Google 测试广告）能打 debug 包；release 会被 validateBrand 拦下，AAB 会被 validateUpload 拦下。
# 生成于 {{DATE}}，方向：{{DIRECTION_NAME}}

# ---------------------------------------------------------------- 上架身份
# 包名上架后不能再改
APPLICATION_ID={{APPLICATION_ID}}
VERSION_CODE=10000
VERSION_NAME=1.0.0
# 上传密钥配置文件（项目根目录，不入库）。未填时 release 用 debug 签名，只能自测
SIGNING_PROPERTIES=

# ---------------------------------------------------------------- 名称与链接
APP_NAME={{APP_NAME}}
APP_TAGLINE={{TAGLINE}}
PRIVACY_URL={{PRIVACY_URL}}
FEEDBACK_EMAIL={{FEEDBACK_EMAIL}}
# 开发者网站：app-ads.txt 部署在它的根目录，Play 商店页的“网站”也填它
WEBSITE_URL={{WEBSITE_URL}}

# ---------------------------------------------------------------- 广告
# Google AdMob：本应用在 AdMob 后台单独新建的应用 ID 和广告位；占位时为 Google 官方测试 ID。
# debug 包无论这里填什么都固定使用测试广告位
ADMOB_APP_ID={{ADMOB_APP_ID}}
ADMOB_BANNER_AD_UNIT_ID={{ADMOB_BANNER}}
ADMOB_INTERSTITIAL_AD_UNIT_ID={{ADMOB_INTERSTITIAL}}
ADMOB_APP_OPEN_AD_UNIT_ID={{ADMOB_APP_OPEN}}
# 可选：只收测试广告的设备 ID（逗号分隔），建议放 ~/.gradle/gradle.properties
ADMOB_TEST_DEVICE_IDS=

# AppLovin MAX：保持 YOUR_ 前缀时不初始化，直接用 AdMob
APPLOVIN_SDK_KEY=YOUR_SDK_KEY
MAX_BANNER_AD_UNIT_ID=YOUR_BANNER_AD_UNIT_ID
MAX_INTERSTITIAL_AD_UNIT_ID=YOUR_INTERSTITIAL_AD_UNIT_ID
MAX_APP_OPEN_AD_UNIT_ID=YOUR_APP_OPEN_AD_UNIT_ID

# ---------------------------------------------------------------- 归因
# Adjust App Token，留空不初始化
ADJUST_APP_TOKEN=
